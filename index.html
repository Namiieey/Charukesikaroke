<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charukesi Sangeetha Nritha Kalakshetram | Karaoke</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brown: {
                            50: '#fdfbf7',
                            100: '#f6f0e6',
                            200: '#ebdccd',
                            300: '#debfab',
                            400: '#ce9d80',
                            500: '#a67c52',
                            600: '#8e6641',
                            700: '#765236',
                            800: '#5c4a3d',
                            900: '#4a3b32',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fdfbf7;
            background-image: radial-gradient(#ebdccd 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Custom Audio Slider */
        .audio-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #a67c52;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(166, 124, 82, 0.4);
            transition: transform 0.1s;
        }

        .audio-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .audio-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #a67c52;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(166, 124, 82, 0.4);
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(235, 220, 205, 0.5);
        }
        
        .record-art.playing {
            animation: spin 10s linear infinite;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-brown-800 font-sans antialiased min-h-screen flex flex-col selection:bg-brown-200 selection:text-brown-900">

    <header class="glass-panel sticky top-0 z-50 border-b border-brown-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-center sm:justify-start gap-4">
            <img src="https://plain-apac-prod-public.komododecks.com/202610/09/DNGr604lqMrOHA75SINW/image.jpg" 
                 alt="Charukesi Logo" 
                 class="w-12 h-12 sm:w-14 sm:h-14 rounded-full object-cover shadow-md border-2 border-white">
            <div class="text-center sm:text-left">
                <h1 class="font-serif text-xl sm:text-2xl font-bold text-brown-900 tracking-wide">Charukesi</h1>
                <p class="text-[10px] sm:text-xs font-semibold text-brown-600 uppercase tracking-[0.2em] mt-0.5">Sangeetha Nritha Kalakshetram</p>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12 flex flex-col lg:flex-row gap-8 lg:gap-12 items-start">
        
        <!-- Player Section -->
        <div class="w-full lg:w-1/2 glass-panel rounded-3xl p-6 sm:p-10 shadow-xl flex flex-col items-center">
            
            <!-- Record Art -->
            <div class="relative w-48 h-48 sm:w-64 sm:h-64 mb-8">
                <div class="absolute inset-0 rounded-full bg-gradient-to-br from-brown-200 to-brown-400 shadow-2xl animate-pulse opacity-20"></div>
                <img id="record-art" src="https://plain-apac-prod-public.komododecks.com/202610/09/DNGr604lqMrOHA75SINW/image.jpg" 
                     alt="Record Art" 
                     class="relative w-full h-full rounded-full object-cover border-4 border-white shadow-[0_10px_30px_rgba(92,74,61,0.2)] transition-transform duration-500">
                <!-- Record center hole -->
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full border border-brown-200 shadow-inner z-10"></div>
            </div>

            <!-- Track Info -->
            <div class="text-center w-full mb-8">
                <h2 id="current-title" class="font-serif text-2xl sm:text-3xl font-bold text-brown-900 mb-2 truncate px-4">Select a Track</h2>
                <p class="text-sm font-medium text-brown-500 tracking-wider uppercase">Classical Karaoke</p>
            </div>

            <!-- Progress Bar -->
            <div class="w-full flex flex-col mb-8">
                <div class="flex justify-between text-xs font-semibold text-brown-500 mb-2 px-1">
                    <span id="current-time">0:00</span>
                    <span id="duration-time">0:00</span>
                </div>
                <div class="relative w-full h-1.5 bg-brown-200 rounded-full flex items-center">
                    <!-- Custom progress fill -->
                    <div id="progress-fill" class="absolute left-0 top-0 h-full bg-brown-500 rounded-full pointer-events-none" style="width: 0%;"></div>
                    <input type="range" id="progress-bar" class="audio-slider absolute w-full h-full opacity-0" value="0" min="0" max="100" step="0.1">
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-center gap-6 sm:gap-8">
                <button id="btn-prev" class="text-brown-400 hover:text-brown-700 transition-colors p-2 rounded-full hover:bg-brown-100" aria-label="Previous Track">
                    <i class="ph-fill ph-skip-back text-3xl"></i>
                </button>
                
                <button id="btn-play" class="w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center rounded-full bg-brown-500 text-white shadow-lg shadow-brown-500/30 hover:bg-brown-600 hover:scale-105 transition-all duration-300" aria-label="Play/Pause">
                    <i id="play-icon" class="ph-fill ph-play text-3xl sm:text-4xl ml-1"></i>
                </button>
                
                <button id="btn-next" class="text-brown-400 hover:text-brown-700 transition-colors p-2 rounded-full hover:bg-brown-100" aria-label="Next Track">
                    <i class="ph-fill ph-skip-forward text-3xl"></i>
                </button>
            </div>
            
            <!-- Hidden Audio Element -->
            <audio id="main-audio" preload="metadata"></audio>
        </div>

        <div class="w-full lg:w-1/2 flex flex-col h-full">
            <h3 class="font-serif text-xl sm:text-2xl font-bold text-brown-900 mb-6 px-2">Playlist</h3>
            
            <div id="playlist-container" class="space-y-3 flex-grow overflow-y-auto pr-2 pb-8">
                <!-- Playlist items injected via JS -->
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Track Data
            const tracks = [
                { id: 0, title: "Shanmugha sodari", url: "https://files.catbox.moe/694apk.mp3" },
                { id: 1, title: "Sangeethame", url: "https://files.catbox.moe/k7w9lh.mp3" },
                { id: 2, title: "Pazhanimalai murugante", url: "https://files.catbox.moe/hixc2q.mp3" },
                { id: 3, title: "Kali Badrakali", url: "https://files.catbox.moe/lvsic1.mp3" }
            ];

            // DOM Elements
            const audio = document.getElementById('main-audio');
            const playBtn = document.getElementById('btn-play');
            const playIcon = document.getElementById('play-icon');
            const prevBtn = document.getElementById('btn-prev');
            const nextBtn = document.getElementById('btn-next');
            const progressBar = document.getElementById('progress-bar');
            const progressFill = document.getElementById('progress-fill');
            const currentTimeEl = document.getElementById('current-time');
            const durationTimeEl = document.getElementById('duration-time');
            const currentTitleEl = document.getElementById('current-title');
            const recordArt = document.getElementById('record-art');
            const playlistContainer = document.getElementById('playlist-container');

            // State
            let currentTrackIndex = 0;
            let isPlaying = false;
            let isDragging = false;

            // Format time in MM:SS
            const formatTime = (seconds) => {
                if (isNaN(seconds) || seconds < 0) return "0:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return mins + ":" + (secs < 10 ? "0" : "") + secs;
            };

            // Render playlist items dynamically
            const renderPlaylist = () => {
                playlistContainer.innerHTML = '';
                tracks.forEach((track, index) => {
                    const isActive = index === currentTrackIndex;
                    
                    const item = document.createElement('div');
                    item.className = 'group flex items-center p-4 rounded-2xl cursor-pointer transition-all duration-300 ' + 
                                     (isActive ? 'bg-white shadow-md border-l-4 border-brown-500' : 'bg-transparent hover:bg-white/50 border-l-4 border-transparent');
                    
                    item.innerHTML = 
                        '<div class="w-10 h-10 flex-shrink-0 rounded-full flex items-center justify-center mr-4 transition-colors ' + 
                        (isActive ? 'bg-brown-100 text-brown-600' : 'bg-brown-50 text-brown-300 group-hover:bg-brown-100 group-hover:text-brown-500') + '">' +
                            (isActive && isPlaying ? '<i class="ph-fill ph-speaker-high text-xl"></i>' : '<i class="ph-fill ph-music-note text-xl"></i>') +
                        '</div>' +
                        '<div class="flex-grow overflow-hidden">' +
                            '<h4 class="font-medium truncate transition-colors ' + (isActive ? 'text-brown-900' : 'text-brown-700 group-hover:text-brown-900') + '">' + track.title + '</h4>' +
                            '<p class="text-xs text-brown-400 mt-0.5">Track 0' + (index + 1) + '</p>' +
                        '</div>';

                    item.addEventListener('click', () => {
                        if (currentTrackIndex === index) {
                            togglePlay();
                        } else {
                            loadTrack(index);
                            playAudio();
                        }
                    });

                    playlistContainer.appendChild(item);
                });
            };

            // Load a specific track
            const loadTrack = (index) => {
                currentTrackIndex = index;
                const track = tracks[currentTrackIndex];
                
                audio.src = track.url;
                currentTitleEl.textContent = track.title;
                
                // Reset progress
                progressBar.value = 0;
                progressFill.style.width = '0%';
                currentTimeEl.textContent = "0:00";
                
                renderPlaylist();
            };

            // Play the audio
            const playAudio = () => {
                isPlaying = true;
                audio.play().catch(e => console.error("Error playing audio:", e));
                playIcon.classList.remove('ph-play');
                playIcon.classList.add('ph-pause');
                playIcon.classList.remove('ml-1'); // fix pause icon centering
                recordArt.classList.add('playing');
                renderPlaylist();
            };

            // Pause the audio
            const pauseAudio = () => {
                isPlaying = false;
                audio.pause();
                playIcon.classList.remove('ph-pause');
                playIcon.classList.add('ph-play');
                playIcon.classList.add('ml-1'); // adjust play icon centering
                recordArt.classList.remove('playing');
                renderPlaylist();
            };

            // Toggle Play/Pause
            const togglePlay = () => {
                if (isPlaying) {
                    pauseAudio();
                } else {
                    playAudio();
                }
            };

            // Previous track logic
            const prevTrack = () => {
                let newIndex = currentTrackIndex - 1;
                if (newIndex < 0) newIndex = tracks.length - 1;
                loadTrack(newIndex);
                if (isPlaying) playAudio();
            };

            // Next track logic
            const nextTrack = () => {
                let newIndex = currentTrackIndex + 1;
                if (newIndex >= tracks.length) newIndex = 0;
                loadTrack(newIndex);
                if (isPlaying) playAudio();
            };

            // Event Listeners for controls
            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);

            // Audio Metadata loaded
            audio.addEventListener('loadedmetadata', () => {
                durationTimeEl.textContent = formatTime(audio.duration);
                progressBar.max = audio.duration;
            });

            // Audio time updates
            audio.addEventListener('timeupdate', () => {
                if (!isDragging && !isNaN(audio.duration)) {
                    progressBar.value = audio.currentTime;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    
                    const progressPercent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = progressPercent + '%';
                }
            });

            // Handle track ending
            audio.addEventListener('ended', () => {
                nextTrack();
            });

            // Progress bar interactions (scrubbing)
            progressBar.addEventListener('mousedown', () => { isDragging = true; });
            progressBar.addEventListener('touchstart', () => { isDragging = true; }, { passive: true });
            
            progressBar.addEventListener('input', () => {
                currentTimeEl.textContent = formatTime(progressBar.value);
                if (!isNaN(audio.duration)) {
                    const progressPercent = (progressBar.value / audio.duration) * 100;
                    progressFill.style.width = progressPercent + '%';
                }
            });

            const finishScrubbing = () => {
                if (isDragging) {
                    isDragging = false;
                    audio.currentTime = progressBar.value;
                }
            };

            progressBar.addEventListener('mouseup', finishScrubbing);
            progressBar.addEventListener('touchend', finishScrubbing);
            
            // Initialize the player
            loadTrack(currentTrackIndex);
        });
    </script>
</body>
</html>
